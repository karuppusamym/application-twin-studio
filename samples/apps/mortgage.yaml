# Mortgage servicing dependency simulator (backend only - no frontend needed).
schema_version: "1.0"
application_id: mortgage
name: Mortgage Servicing API
spec_version: "0.1.0"
interfaces:
  - {id: loans-api, protocol: http, auth: {type: bearer}}
  - {id: loans-db, protocol: sql}
fidelity:
  contract: {required: true, status: modeled}
  behavior: {required: false, status: modeled}
entities:
  loan:
    key: loan_id
    fields:
      loan_id: string
      customer_id: string
      account_id: string
      principal: decimal
      currency: string
      status: {type: string, enum: [ACTIVE, DELINQUENT, CLOSED]}
errors:
  LOAN_NOT_FOUND: {status: 404, message: Loan not found}
operations:
  - id: get-loan
    interface: loans-api
    route: GET /loans/{loan_id}
    verification: demonstration
    steps:
      - load: {entity: loan, key: $path.loan_id, not_found: LOAN_NOT_FOUND}
      - respond: {status: 200, body: $loan}
  - id: list-loans
    interface: loans-api
    route: GET /loans
    verification: demonstration
    steps:
      - query: {as: items, entity: loan, where: {customer_id: $query.customer_id}}
      - respond: {status: 200, body: {items: $items}}
