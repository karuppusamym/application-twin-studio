id: kyc-mismatch
title: KYC identity mismatch
description: KYC reports a mismatch. Case becomes an exception and the servicing account is put on hold.
fixture: loan-review-base
apps:
- qaqc
- mortgage
- kyc
- documents
- corebank
process: loan-qc-review
inputs:
  case_id: QC-1003
assertions:
- id: case-state
  type: state
  app: qaqc
  entity: case
  key: QC-1003
  expect:
    state: EXCEPTION
  critical: true
- id: runner-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001003'
  equals: 1
  critical: true
- id: host-memo-code
  type: rows
  app: corebank
  entity: memo
  where:
    account_id: '4000001003'
  each:
    code: QCHOLD
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001003'
  expect:
    status: HOLD
  critical: true
- id: note-count
  type: count
  app: qaqc
  entity: note
  where:
    case_id: QC-1003
  equals: 1
  critical: true
- id: evaluated-events
  type: event
  app: qaqc
  event: case.evaluated
  count: 1
