id: closure-already-closed
title: Account already closed
description: ''
fixture: loan-review-base
apps:
- corebank
process: account-closure
inputs:
  account_id: '4000002001'
patch:
- app: corebank
  entity: account
  key_field: account_id
  key: '4000002001'
  set:
    status: CLOSED
assertions:
- id: output-status
  type: output
  path: status
  equals: REJECTED
  critical: true
- id: output-message
  type: output
  path: message
  equals: ACCOUNT ALREADY CLOSED
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000002001'
  expect:
    status: CLOSED
  critical: true
- id: event-account.closed
  type: event
  app: corebank
  event: account.closed
  count: 0
