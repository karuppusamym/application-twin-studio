id: resume-pending-case
title: Pending case completes once the document arrives
description: Case starts in PENDING_EVIDENCE and the document has now been received.
fixture: loan-review-base
apps:
- qaqc
- mortgage
- kyc
- documents
- corebank
process: loan-qc-review
inputs:
  case_id: QC-1002
patch:
- app: qaqc
  entity: case
  key_field: case_id
  key: QC-1002
  set:
    state: PENDING_EVIDENCE
    reason: DOCUMENT_MISSING
- app: documents
  entity: document
  key_field: document_id
  key: D301
  set:
    status: RECEIVED
assertions:
- id: case-state
  type: state
  app: qaqc
  entity: case
  key: QC-1002
  expect:
    state: COMPLETED
  critical: true
- id: runner-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001002'
  equals: 1
  critical: true
- id: host-memo-code
  type: rows
  app: corebank
  entity: memo
  where:
    account_id: '4000001002'
  each:
    code: QCPASS
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001002'
  expect:
    status: ACTIVE
  critical: true
- id: note-count
  type: count
  app: qaqc
  entity: note
  where:
    case_id: QC-1002
  equals: 1
  critical: true
- id: evaluated-events
  type: event
  app: qaqc
  event: case.evaluated
  count: 1
