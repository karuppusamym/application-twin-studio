id: wire-review-threshold
title: Large wire is held for review
description: Amount above 100,000 must be held, not released.
fixture: loan-review-base
apps:
- payments
- risk
- corebank
process: wire-release
inputs:
  wire_id: W-5002
assertions:
- id: output-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: output-action
  type: output
  path: action
  equals: HOLD
  critical: true
- id: output-decision
  type: output
  path: decision
  equals: REVIEW
  critical: true
- id: screening-count
  type: count
  app: risk
  entity: screening
  where:
    wire_id: W-5002
  equals: 1
  critical: true
- id: wire-state
  type: state
  app: payments
  entity: wire
  key: W-5002
  expect:
    status: HELD
    reason: AMOUNT_THRESHOLD
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001002'
  expect:
    status: ACTIVE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001002'
  equals: 0
  critical: true
- id: event-wire.released
  type: event
  app: payments
  event: wire.released
  count: 0
