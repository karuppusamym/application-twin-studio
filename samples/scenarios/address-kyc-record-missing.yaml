- id: host-account-address
  type: state
  app: corebank
  entity: account
  key: '4000001001'
  expect:
    postal_code: null
  critical: true
- id: event-request.completed
  type: event
  app: crm
  event: request.completed
  count: 0
- id: event-address.updated
  type: event
  app: corebank
  event: address.updated
  count: 0
