id: address-kyc-record-missing
title: Customer has no KYC record
description: ''
fixture: loan-review-base
apps:
- crm
- kyc
- corebank
process: address-change
inputs:
  request_id: AR-7001
remove:
- app: kyc
  entity: identity
  key_field: customer_id
  key: C100
assertions:
- id: output-status
  type: output
  path: status
  equals: FAILED
  critical: true
- id: output-outcome
  type: output
  path: outcome
  equals: NONE
