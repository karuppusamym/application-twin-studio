id: closure-on-hold
title: Account on hold
description: ''
fixture: loan-review-base
apps:
- corebank
process: account-closure
inputs:
  account_id: '4000002003'
assertions:
- id: output-status
  type: output
  path: status
  equals: REJECTED
  critical: true
- id: output-message
  type: output
  path: message
  equals: ACCOUNT ON HOLD - CLOSE REJECTED
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000002003'
  expect:
    status: HOLD
  critical: true
- id: event-account.closed
  type: event
  app: corebank
  event: account.closed
  count: 0
