id: already-completed
title: Case was already completed
description: Re-processing a completed case must be a no-op.
fixture: loan-review-base
apps:
- qaqc
- mortgage
- kyc
- documents
- corebank
process: loan-qc-review
inputs:
  case_id: QC-1005
assertions:
- id: case-state
  type: state
  app: qaqc
  entity: case
  key: QC-1005
  expect:
    state: COMPLETED
  critical: true
- id: runner-status
  type: output
  path: status
  equals: SKIPPED
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001005'
  equals: 0
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001005'
  expect:
    status: ACTIVE
  critical: true
- id: note-count
  type: count
  app: qaqc
  entity: note
  where:
    case_id: QC-1005
  equals: 0
  critical: true
- id: evaluated-events
  type: event
  app: qaqc
  event: case.evaluated
  count: 0
