id: wire-amount-at-threshold
title: 'Boundary: exactly 100,000.00 is released'
description: The rule is strictly greater than 100,000.
fixture: loan-review-base
apps:
- payments
- risk
- corebank
process: wire-release
inputs:
  wire_id: W-5001
patch:
- app: payments
  entity: wire
  key_field: wire_id
  key: W-5001
  set:
    amount: '100000.00'
assertions:
- id: output-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: output-action
  type: output
  path: action
  equals: RELEASE
  critical: true
- id: output-decision
  type: output
  path: decision
  equals: CLEAR
  critical: true
- id: screening-count
  type: count
  app: risk
  entity: screening
  where:
    wire_id: W-5001
  equals: 1
  critical: true
- id: wire-state
  type: state
  app: payments
  entity: wire
  key: W-5001
  expect:
    status: RELEASED
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001001'
  expect:
    status: ACTIVE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001001'
  equals: 0
  critical: true
- id: event-wire.released
  type: event
  app: payments
  event: wire.released
  count: 1
