id: document-record-missing
title: Document record absent
description: 'Intentional anomaly: the document id on the case has no record in the repository.'
fixture: loan-review-base
apps:
- qaqc
- mortgage
- kyc
- documents
- corebank
process: loan-qc-review
inputs:
  case_id: QC-1001
remove:
- app: documents
  entity: document
  key_field: document_id
  key: D300
intentional_anomalies:
- qaqc.case.document_id
assertions:
- id: case-state
  type: state
  app: qaqc
  entity: case
  key: QC-1001
  expect:
    state: PENDING_EVIDENCE
  critical: true
- id: runner-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001001'
  equals: 0
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001001'
  expect:
    status: ACTIVE
  critical: true
- id: note-count
  type: count
  app: qaqc
  entity: note
  where:
    case_id: QC-1001
  equals: 1
  critical: true
- id: evaluated-events
  type: event
  app: qaqc
  event: case.evaluated
  count: 1
