id: kyc-outage
title: KYC is down
description: KYC never answers. The case must stay NEW and the automation must not post a memo or note.
fixture: loan-review-base
apps:
- qaqc
- mortgage
- kyc
- documents
- corebank
process: loan-qc-review
inputs:
  case_id: QC-1001
faults:
- app: kyc
  operation: get-identity
  occurrence: all
  type: unavailable
assertions:
- id: case-state
  type: state
  app: qaqc
  entity: case
  key: QC-1001
  expect:
    state: NEW
  critical: true
- id: runner-status
  type: output
  path: status
  equals: FAILED
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001001'
  equals: 0
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001001'
  expect:
    status: ACTIVE
  critical: true
- id: note-count
  type: count
  app: qaqc
  entity: note
  where:
    case_id: QC-1001
  equals: 0
  critical: true
- id: evaluated-events
  type: event
  app: qaqc
  event: case.evaluated
  count: 0
