id: address-invalid-postal
title: Host rejects an invalid postal code
description: The requested postal code is not five digits; the host refuses it and the CRM request is rejected.
fixture: loan-review-base
apps:
- crm
- kyc
- corebank
process: address-change
inputs:
  request_id: AR-7003
assertions:
- id: output-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: output-outcome
  type: output
  path: outcome
  equals: REJECTED
  critical: true
- id: request-state
  type: state
  app: crm
  entity: request
  key: AR-7003
  expect:
    state: REJECTED
    reason: HOST_REJECTED
  critical: true
- id: crm-customer-address
  type: state
  app: crm
  entity: customer
  key: C101
  expect:
    postal_code: '03060'
  critical: true
- id: host-account-address
  type: state
  app: corebank
  entity: account
  key: '4000001002'
  expect:
    postal_code: null
  critical: true
- id: event-request.completed
  type: event
  app: crm
  event: request.completed
  count: 0
- id: event-address.updated
  type: event
  app: corebank
  event: address.updated
  count: 0
