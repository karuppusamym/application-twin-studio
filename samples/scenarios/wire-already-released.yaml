id: wire-already-released
title: Wire was already released
description: Re-processing must not screen or change anything.
fixture: loan-review-base
apps:
- payments
- risk
- corebank
process: wire-release
inputs:
  wire_id: W-5004
assertions:
- id: output-status
  type: output
  path: status
  equals: SKIPPED
  critical: true
- id: output-action
  type: output
  path: action
  equals: NONE
  critical: true
- id: output-decision
  type: output
  path: decision
  equals: NONE
  critical: true
- id: screening-count
  type: count
  app: risk
  entity: screening
  where:
    wire_id: W-5004
  equals: 0
  critical: true
- id: wire-state
  type: state
  app: payments
  entity: wire
  key: W-5004
  expect:
    status: RELEASED
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001004'
  expect:
    status: ACTIVE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001004'
  equals: 0
  critical: true
- id: event-wire.released
  type: event
  app: payments
  event: wire.released
  count: 0
