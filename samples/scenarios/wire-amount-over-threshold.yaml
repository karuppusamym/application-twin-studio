id: wire-amount-over-threshold
title: 'Boundary: 100,000.01 is held'
description: One cent over the threshold. Decimal arithmetic, no float rounding.
fixture: loan-review-base
apps:
- payments
- risk
- corebank
process: wire-release
inputs:
  wire_id: W-5001
patch:
- app: payments
  entity: wire
  key_field: wire_id
  key: W-5001
  set:
    amount: '100000.01'
assertions:
- id: output-status
  type: output
  path: status
  equals: DONE
  critical: true
- id: output-action
  type: output
  path: action
  equals: HOLD
  critical: true
- id: output-decision
  type: output
  path: decision
  equals: REVIEW
  critical: true
- id: screening-count
  type: count
  app: risk
  entity: screening
  where:
    wire_id: W-5001
  equals: 1
  critical: true
- id: wire-state
  type: state
  app: payments
  entity: wire
  key: W-5001
  expect:
    status: HELD
    reason: AMOUNT_THRESHOLD
  critical: true
- id: account-status
  type: state
  app: corebank
  entity: account
  key: '4000001001'
  expect:
    status: ACTIVE
  critical: true
- id: host-memo-count
  type: count
  app: corebank
  entity: memo
  where:
    account_id: '4000001001'
  equals: 0
  critical: true
- id: event-wire.released
  type: event
  app: payments
  event: wire.released
  count: 0
